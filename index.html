<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamins de Talus</title>
<meta name="description" content="L'app de Gamins de Talus : factures, finances, heures, tâches, cultures, inventaire et contacts.">
<meta name="theme-color" content="#2E6A3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face { font-family: "Bricolage"; src: url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Bricolage"; src: url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Atkinson"; src: url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Atkinson"; src: url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }

/* Mise en page : une barre en haut, l'accueil en tableau de bord + tuiles, chaque module en panneaux simples.
   Thème clair uniquement. Chaque module a sa couleur (tuile, onglets, barre du haut) ;
   vert pour l'action, terre cuite pour ce qui demande de l'attention. */
:root {
  --bg: #F8F8F3; --surface: #FFFFFF; --ink: #1B231E; --muted: #5C665F; --line: #DDE1D5;
  --accent: #2E7D4F; --accent-ink: #FFFFFF; --soft: #E4F2E8; --late: #B5471B; --late-soft: #FBE6DC;
  --paid: #2E7D4F; --danger: #B3261E; --blue: #2563A8; --blue-soft: #E3EEFA; --warn: #A86A00; --warn-soft: #FFF1D6;
  /* Quatre couleurs, une par paire de modules voisins : Messagerie + Contacts (jaune), Tâches + Calendrier (magenta),
     Ventes + Finances (bleu), Cultures + Irrigation (vert). */
  --c-factures: #2563A8; --s-factures: #E6F0FB;
  --c-finances: #2563A8; --s-finances: #E6F0FB;
  --c-heures: #B4237A; --s-heures: #FBE6F1; --c-calendrier: #B4237A; --s-calendrier: #FBE6F1;
  --ev-travail: #D9822B; --ev-recolte: #5A8A1C; --ev-livraison: #2563A8; --ev-vente: #0E7C83; --ev-vacances: #8E5BB5; --ev-autre: #6B7480;
  --c-taches: #B4237A; --s-taches: #FBE6F1;
  --c-cultures: #4F7D17; --s-cultures: #EEF6DE;
  --c-inventaire: #7A4FA0; --s-inventaire: #F2EAF8;
  --c-contacts: #A35C00; --s-contacts: #FCEFD6;
  --c-reglages: #586270; --s-reglages: #EDEFF2;
  --c-messages: #A35C00; --s-messages: #FCEFD6;
  --c-irrigation: #4F7D17; --s-irrigation: #EEF6DE;
  --mod: var(--accent); --mod-soft: var(--soft);
  --font-display: "Bricolage", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
[data-mod="factures"], .t-factures { --mod: var(--c-factures); --mod-soft: var(--s-factures); }
[data-mod="finances"], .t-finances { --mod: var(--c-finances); --mod-soft: var(--s-finances); }
[data-mod="calendrier"], .t-calendrier { --mod: var(--c-calendrier); --mod-soft: var(--s-calendrier); }
[data-mod="heures"], .t-heures { --mod: var(--c-heures); --mod-soft: var(--s-heures); }
[data-mod="taches"], .t-taches { --mod: var(--c-taches); --mod-soft: var(--s-taches); }
[data-mod="cultures"], .t-cultures { --mod: var(--c-cultures); --mod-soft: var(--s-cultures); }
[data-mod="inventaire"], .t-inventaire { --mod: var(--c-inventaire); --mod-soft: var(--s-inventaire); }
[data-mod="contacts"], .t-contacts { --mod: var(--c-contacts); --mod-soft: var(--s-contacts); }
[data-mod="drive"], .t-drive { --mod: #5B6B7A; --mod-soft: #EAEEF2; }
[data-mod="irrigation"], .t-irrigation { --mod: var(--c-irrigation); --mod-soft: var(--s-irrigation); }
[data-mod="messages"], .t-messages, [data-mod="mails"], .t-mails { --mod: var(--c-messages); --mod-soft: var(--s-messages); }
[data-mod="reglages"], .t-reglages { --mod: var(--c-reglages); --mod-soft: var(--s-reglages); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body.sheet-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Barre du haut */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 3px solid var(--mod); }
body[data-mod="accueil"] .bar { border-bottom-color: var(--line); border-bottom-width: 1px; }
.bar h1 { color: var(--mod); }
body[data-mod="accueil"] .bar h1 { color: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--surface); }
.bar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.home { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.sync { font-size: 12.5px; border-radius: 999px; padding: 3px 10px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; background: none; white-space: nowrap; }
.sync.pend { color: var(--blue); border-color: var(--blue); }
.sync.err { color: var(--late); background: var(--late-soft); border-color: transparent; }
.sync.off { color: var(--muted); }
@media (max-width: 480px) { .me { display: none; } }
.drive { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 11px 4px 9px; background: var(--soft); color: var(--ink); text-decoration: none; white-space: nowrap; }
.drive:hover { background: var(--line); }
.drive svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
button.gear { border: 0; background: none; cursor: pointer; padding: 0; }
.gear { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; color: var(--muted); }
.gear:hover, body[data-mod="reglages"] .gear { background: var(--soft); color: var(--ink); }
.gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
.btn.big { font-size: 16px; padding: 12px 18px; display: inline-flex; align-items: center; gap: 8px; }
.btn.big svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.chips-h { gap: 6px; margin: -4px 0 12px; }
/* Messagerie */
.chat { display: flex; flex-direction: column; }
.chat-head h2 { margin: 0; }
.chat-who { margin: 4px 0 10px; }
.chat-fermer { display: none; }
/* Ordinateur : la discussion occupe toute la hauteur sous la barre du haut ; seule la liste des messages défile */
@media (min-width: 701px) {
  body.chat-plein { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  body.chat-plein .bar { flex: none; }
  body.chat-plein main#view { flex: 1; min-height: 0; width: 100%; max-width: 980px; padding-block: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; }
  body.chat-plein .panel.chat { flex: 1; min-height: 0; margin: 0; }
  body.chat-plein .msg-list { flex: 1; min-height: 0; max-height: none; }
  body.chat-plein .chat-aide { display: none; }
  body.chat-plein .pins { max-height: 22vh; overflow-y: auto; }
  .chat .chat-fermer { display: none; }
}
@media (max-width: 700px) {
  body.chat-plein { overflow: hidden; }
  body.chat-plein .panel.chat { position: fixed; inset: 0; z-index: 25; margin: 0; border: 0; border-radius: 0; height: 100dvh; padding: calc(8px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom)); overflow: hidden; }
  body.chat-plein .chat-head { gap: 8px; justify-content: flex-start; }
  body.chat-plein .chat-head h2 { flex: 1; font-size: 20px; }
  body.chat-plein .chat-fermer { display: inline-flex; font-size: 18px; padding: 4px 12px; }
  body.chat-plein .chat-head .btn[data-act="discordSheet"] { font-size: 0; padding: 6px 8px; gap: 0; }
  body.chat-plein .chat-head .btn[data-act="discordSheet"] svg { font-size: 14px; }
  body.chat-plein .chat-who, body.chat-plein .chat-aide { display: none; }
  body.chat-plein .msg-list { flex: 1; min-height: 0; max-height: none; margin: 8px -12px 0; padding: 10px 8px; }
  body.chat-plein .composer { margin-top: 8px; }
  body.chat-plein .pins { max-height: 30vh; overflow-y: auto; }
}
.btn.small.on { background: var(--s-messages); border-color: transparent; color: var(--c-messages); }
.ic-d { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; vertical-align: -3px; margin-right: 6px; }
.msg-list { overflow-anchor: none; display: flex; flex-direction: column; gap: 3px; max-height: min(62vh, 640px); min-height: 220px; overflow-y: auto; padding: 10px 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg); margin: 0 -4px; }
.msg-day { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin: 10px 0 6px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 82%; margin-top: 8px; }
.msg.suite { margin-top: 0; }
.msg.mine { align-self: flex-end; align-items: flex-end; }
.msg-who { font-size: 12.5px; font-weight: 700; color: var(--c-messages); margin: 0 0 2px 10px; }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 8px 12px 6px; overflow-wrap: anywhere; line-height: 1.4; }
.msg.mine .bubble { background: var(--c-messages); border-color: var(--c-messages); color: #fff; border-radius: 16px 16px 4px 16px; }
.msg.mine .bubble a { color: #fff; }
.msg-t { display: block; text-align: right; font-size: 11px; opacity: .7; margin-top: 2px; }
.msg-del { border: 0; background: none; color: inherit; cursor: pointer; font-size: 14px; padding: 0 2px; opacity: .8; }
.msg-vu { font-size: 12px; color: var(--muted); margin: 4px 6px 0; }
.msg-vu.mine { align-self: flex-end; }
.composer { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
.composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 220px; font: inherit; }
.btn.photo-btn { padding: 0; width: 44px; height: 44px; display: grid; place-items: center; flex: none; cursor: pointer; }
.btn.photo-btn svg, .btn.justif-btn svg, .photo-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
.justif-btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; align-self: flex-start; }
.bubble.has-photo { padding: 4px 4px 6px; }
.bubble.has-photo .msg-t { padding: 0 8px; }
.msg-photo { display: block; border: 0; padding: 0; background: none; cursor: zoom-in; margin-bottom: 4px; }
.msg-photo img { display: block; max-width: min(280px, 62vw); max-height: 340px; height: auto; border-radius: 12px; background: color-mix(in srgb, var(--line) 60%, transparent); min-width: 120px; min-height: 90px; object-fit: cover; }
.msg-prev { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 14px; }
.msg-prev img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
.msg-prev span { flex: 1; color: var(--muted); }
.grande-photo { display: block; width: 100%; max-height: 70vh; object-fit: contain; border-radius: 10px; background: var(--bg); min-height: 200px; }
.bl-signe { margin: 10px 0 4px; padding: 10px 0 2px; border-top: 1px solid var(--line); }
.bl-signe .flabel { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.grid3 { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 0 10px; }
.grid3 .field { margin-bottom: 6px; }
.fich-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.fich { position: relative; }
.fich-voir { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px; cursor: zoom-in; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 96px; }
.fich-voir img, .fich-pdf { width: 86px; height: 86px; object-fit: cover; border-radius: 7px; background: var(--bg); }
.fich-pdf { display: grid; place-items: center; font-weight: 800; color: var(--danger); font-family: var(--font-display); }
.fich-voir small { font-size: 11px; color: var(--muted); max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fich-x { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1; }
.clip { font-size: 13px; margin-left: 4px; }
.mbar { display: inline-block; height: 9px; border-radius: 3px; vertical-align: 0; margin-right: 4px; }
.mbar.et0 { background: var(--warn); }
.mbar.pluie { background: #1C7FC0; }
.prev { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
.prev-j { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border-radius: 10px; background: var(--bg); font-size: 13px; text-align: center; }
.prev-j.pluie { background: #E1F0FA; }
.prev-j .hint { font-size: 11.5px; }
table.irr td { vertical-align: middle; }
.irr-carte { border-top: 1px solid var(--line); padding: 10px 0; }
.irr-carte .hint { display: block; margin-top: 3px; }
@media (min-width: 760px) { .irr-cartes { display: none; } }
@media (max-width: 759px) { .irr-table { display: none; } }
table.irr input.cell-in { width: 84px; }
.seg-mini { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--bg); }
.seg-mini button { border: 0; background: none; border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg-mini button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.msg-menu { border: 0; background: none; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 3px; opacity: .75; }
.msg-menu:hover { opacity: 1; }
.msg-cite { display: block; border: 0; border-left: 3px solid var(--c-messages); background: color-mix(in srgb, var(--c-messages) 8%, var(--surface)); border-radius: 6px; padding: 4px 8px; margin: 0 0 3px; font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; text-align: left; max-width: 100%; }
.msg.mine .msg-cite { align-self: flex-end; }
.msg.pinned .bubble { box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 55%, transparent); }
.msg.flash .bubble { animation: flash 1.5s; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 4px var(--warn); } 100% { box-shadow: none; } }
.pins { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.pin { border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; text-align: left; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-list { display: flex; flex-direction: column; gap: 6px; }
.menu-it { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
.menu-it:hover { background: var(--bg); }
.menu-it.danger { color: var(--danger); }
.mail { border-top: 1px solid var(--line); padding: 12px 0; }
.mail-complet { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-radius: 8px; padding: 10px 12px; margin: 6px 0; font-size: 14px; max-height: 60vh; overflow-y: auto; }
.mail-pj { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
.mail-pj .pj { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.mail.encours { border-left: 3px solid var(--c-messages); padding-left: 10px; }
.mail.fini { opacity: .65; }
.mail-objet { font-weight: 700; margin: 2px 0; }
.mail-extrait { margin: 6px 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; white-space: pre-line; }
.mail-extrait.open { display: block; -webkit-line-clamp: unset; color: var(--ink); }
.mail-etat { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.mail-actions { gap: 6px; }
.notif-choix { width: 100%; border-collapse: collapse; font-size: 15px; }
.notif-choix th { font-size: 13px; text-align: center; padding: 4px 6px; white-space: nowrap; }
.notif-choix td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.notif-choix td + td { text-align: center; vertical-align: middle; }
.notif-choix input { width: 20px; height: 20px; }
.etat-mail.afaire { border-color: var(--c-messages); color: var(--c-messages); font-weight: 700; }
.etat-mail.moi { background: var(--c-messages); border-color: var(--c-messages); color: #fff; font-weight: 700; }
.etat-mail.autre { background: var(--s-messages, #FCEFD6); border-color: var(--c-messages); color: var(--c-messages); }
.etat-mail.fini { color: var(--muted); }
.warn-line { background: var(--late-soft); color: var(--late); border-radius: 8px; padding: 8px 10px; font-size: 14px; margin: 0 0 8px; }
.seg.wrap { flex-wrap: wrap; }
.stk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; border-top: 1px solid var(--line); padding: 10px 0; }
.stk-q { font-size: 17px; font-weight: 600; text-align: right; }
.stk-act { grid-column: 1 / -1; gap: 6px; }
.stk.neg .stk-q { color: var(--late); }
.tpill.champ { background: var(--s-cultures); color: var(--c-cultures); border-color: transparent; }
.panel.self.close { opacity: .8; }
.planches { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: 10px; }
.planche { border: 1px dashed var(--line); background: var(--bg); border-radius: 8px; min-height: 58px; padding: 4px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink); }
.planche b { font-size: 14px; }
.planche span { font-size: 10.5px; line-height: 1.1; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.6); }
.planche.pleine { border: 1px solid transparent; }
.planche.pleine b { color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.6); }
.planche.conflit { outline: 3px solid var(--danger); }
.planche.rot:not(.conflit) { outline: 2px solid var(--warn); outline-offset: -2px; }
.planche.sel { outline: 3px solid var(--ink); }
.panel.peindre { padding: 10px 14px; }
.panel.peindre .field { margin: 0; min-width: 260px; }
.jnl { border-top: 1px solid var(--line); padding: 10px 0; }
.jnl:first-child { border-top: 0; }
.feuille { background: #fff; color: #000; border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px; font-size: 12.5px; line-height: 1.35; max-width: 210mm; margin: 12px auto; }
.feuille header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 2px solid #000; padding-bottom: 4px; flex-wrap: wrap; }
.feuille h1 { font-size: 18px; margin: 0; }
.feuille h2 { font-size: 13.5px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid #999; }
.feuille h3 { font-size: 12.5px; margin: 8px 0 2px; }
.fagenda { width: 100%; border-collapse: collapse; }
.fagenda td { border-bottom: 1px solid #ddd; padding: 3px 4px; vertical-align: top; height: 22px; }
.fagenda td.fj { width: 105px; white-space: nowrap; text-transform: capitalize; }
.fcols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.fliste { list-style: none; padding: 0; margin: 0; }
.fliste li { display: flex; gap: 6px; padding: 2px 0; }
.fliste small { color: #444; }
.case { flex: none; width: 11px; height: 11px; border: 1.2px solid #000; margin-top: 2px; }
.fheures { width: 100%; border-collapse: collapse; }
.fheures th, .fheures td { border: 1px solid #999; padding: 3px; height: 20px; text-align: center; font-size: 11.5px; }
.fheures td:first-child { text-align: left; width: 70px; }
.fnotes { height: 110px; margin-top: 10px; background: repeating-linear-gradient(#fff 0 21px, #bbb 21px 22px); }
@media (max-width: 640px) { .fcols { grid-template-columns: 1fr; } }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff !important; }
  .bar, .no-print, .subtabs, #toast, #scrim { display: none !important; }
  main, #view { padding: 0 !important; margin: 0 !important; max-width: none !important; }
  .feuille { border: 0; padding: 0; margin: 0; max-width: none; font-size: 11.5px; }
  .fcols { grid-template-columns: 1fr 1fr; }
  .fliste li, .fagenda tr { break-inside: avoid; }
}
.star { border: 0; background: none; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; padding: 0 8px 0 0; }
.star.on { color: #E0A100; }
.item .star ~ .who { flex: 1; } /* avec l'étoile des favoris : le nom reste collé à gauche */
.drive.on { background: var(--s-reglages); color: var(--c-reglages); }
.fil { font-weight: 700; } .fil a { text-decoration: none; }
.drv-liste { margin-top: 8px; }
.drv-it { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; }
.drv-nom { border: 0; background: none; font: inherit; text-align: left; cursor: pointer; color: var(--ink); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0; }
#drv-zone.drag { outline: 3px dashed var(--c-reglages); }
.usage .ulig { display: grid; grid-template-columns: 210px minmax(0, 1fr) 120px; gap: 10px; align-items: center; margin: 6px 0; font-size: 14px; }
@media (max-width: 640px) { .usage .ulig { grid-template-columns: 1fr; gap: 3px; } }
.ubar { display: flex; height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.ubar span { display: block; height: 100%; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 10px; }
.engr-row { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 0; margin-bottom: 10px; }
.engr-row.nouveau { border-style: dashed; }
.matrix tr.fic td:first-child { color: var(--c-cultures); }
.fic-cell { width: 100%; border: 0; background: var(--s-cultures); border-radius: 6px; padding: 5px 7px; font: inherit; font-family: var(--font-mono); font-size: 13px; text-align: right; cursor: pointer; color: var(--ink); white-space: nowrap; }
.fic-cell:hover { outline: 1px solid var(--c-cultures); }
.fiche-choix { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
.chip-cu { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
.chip-cu:hover { border-color: var(--mod); background: var(--mod-soft); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.checklist { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; }
.checklist li { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.checklist li > span:nth-child(2) { flex: 1; }
.checklist .ck { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; flex: none; font-size: 13px; }
.checklist .ok .ck { background: var(--soft); color: var(--accent); }
.checklist .todo .ck { background: var(--late-soft); color: var(--late); }
.photo-expiree { display: block; font-size: 13px; opacity: .8; font-style: italic; margin-bottom: 4px; }
.steps { padding-left: 20px; margin: 0 0 14px; display: grid; gap: 6px; font-size: 14.5px; }
.me { border: 0; background: var(--soft); border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: 13px; cursor: pointer; }

main { max-width: 1180px; margin: 0 auto; padding-block: 18px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }

/* Accueil */
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.hello > div { display: flex; flex-direction: column; gap: 2px; }
.hello .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hello h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; background: var(--mod-soft); border: 1px solid color-mix(in srgb, var(--mod) 18%, transparent);
  border-radius: 14px; padding: 16px; min-height: 132px; transition: border-color .15s, transform .15s; }
.tile { position: relative; }
.tile .badge { position: absolute; top: 12px; right: 12px; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--late); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--mod-soft); }

.tile span.tline.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile span.tline strong { color: color-mix(in srgb, var(--mod) 75%, var(--ink)); }
.dash { margin-top: 18px; }
.tile:hover { border-color: var(--mod); box-shadow: 0 4px 14px color-mix(in srgb, var(--mod) 16%, transparent); }
.tile:active { transform: scale(.98); }
.tile .ic { width: 46px; height: 46px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; }
.tile svg { width: 28px; height: 28px; stroke: var(--mod); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tile b { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.1; color: color-mix(in srgb, var(--mod) 70%, var(--ink)); }
.tile span.tline { color: color-mix(in srgb, var(--mod) 35%, var(--ink)); font-size: 13.5px; margin-top: auto; }
.tile span.warn { color: var(--late); font-weight: 700; }
/* Téléphone : juste l'icône et le nom, 4 par ligne ; la pastille se pose sur le coin de l'icône, comme sur Android */
@media (max-width: 600px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { min-height: 0; padding: 10px 2px 9px; gap: 6px; align-items: center; border-radius: 14px; }
  .tile span.tline, .tile span.tline.clamp { display: none; }
  .tile b { font-family: var(--font-body); font-weight: 700; font-size: 12px; text-align: center; overflow-wrap: anywhere; }
  .tile .ic { width: 44px; height: 44px; }
  .tile svg { width: 26px; height: 26px; }
  .tile .badge { top: 4px; right: calc(50% - 32px); min-width: 20px; height: 20px; padding: 0 5px; font-size: 11.5px; box-shadow: 0 0 0 2px var(--mod-soft); }
}.dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; border-top: 4px solid var(--mod); }
.kpi .k { font-size: 13px; color: var(--muted); font-weight: 700; }
.kpi .v { font-family: var(--font-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.15; }
.kpi .s { font-size: 13px; color: var(--muted); }
.kpi .s.bad { color: var(--late); font-weight: 700; }
.todo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.todo .grp { display: flex; flex-direction: column; gap: 6px; }
.todo h3 { display: flex; align-items: center; gap: 8px; color: var(--mod); }
.todo h3 .n { background: var(--mod); color: #fff; border-radius: 999px; font-size: 11.5px; padding: 0 7px; letter-spacing: 0; }
.todo a.it { display: flex; justify-content: space-between; gap: 12px; text-decoration: none; color: inherit; background: var(--mod-soft); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
.todo a.it.bad { background: var(--late-soft); }
/* Urgent, aujourd'hui ou demain : fond plein dans la couleur du module, texte blanc */
.todo a.it.fort { background: var(--mod); color: #fff; font-weight: 700; }
.todo a.it .num { white-space: nowrap; }
.todo .none { color: var(--muted); font-size: 14px; margin: 0; }
.attn { display: flex; flex-direction: column; gap: 8px; }
.attn a { display: flex; justify-content: space-between; gap: 12px; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--late); border-radius: 10px; padding: 10px 14px; }
.attn a.info { border-left-color: var(--accent); }

/* Éléments communs */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0; }
h3 { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.hint { color: var(--muted); margin: 0; font-size: 14px; max-width: 70ch; }
.err { color: var(--late); }
.subtabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.subtabs a { color: var(--muted); text-decoration: none; font-weight: 700; padding: 9px 12px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.subtabs a.on { color: var(--ink); border-bottom-color: var(--mod); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; text-decoration: none; color: var(--ink); min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.link { border: 0; background: none; padding: 4px 0; min-height: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-end { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.between { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.split.wide-left { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
@media (max-width: 900px) { .split, .split.wide-left { grid-template-columns: minmax(0, 1fr); } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 21px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--muted); }
.stat { border-left-color: color-mix(in srgb, var(--mod) 35%, var(--line)); }
.stat.good { border-left-color: var(--accent); } .stat.bad { border-left-color: var(--late); } .stat.blue { border-left-color: var(--blue); }
.table-wrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.list tr.click { cursor: pointer; }
table.list tr.click:hover td, table.list tr.sel td { background: var(--soft); }
table.list .r, table.list th.r { text-align: right; }
table.list tfoot td { font-weight: 700; border-bottom: 0; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.pill.payee, .pill.termine { color: var(--paid); border-color: var(--paid); }
.pill.groupee { color: var(--blue); border-color: var(--blue); }
.pill.retard, .pill.urgent { color: var(--late); background: var(--late-soft); border-color: transparent; }
.pill.encours { color: var(--blue); border-color: var(--blue); }
.pill.warn, .pill.nojust { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); color: #6B4500; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.banner b { color: #5A3A00; }
table.list tr.nojust td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
.pill.annulee { text-decoration: line-through; }
.empty { padding: 20px 4px; color: var(--muted); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sousnav { margin: -4px 0 14px; gap: 6px; }
.sousnav .chip { font-size: 13.5px; padding: 6px 13px; }
.sousnav .chip.on { background: var(--mod); border-color: var(--mod); color: #fff; }
.chip { font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; padding: 4px 11px; cursor: pointer; text-decoration: none; }
.pour .row { gap: 6px; margin-bottom: 6px; }
.pour .chip { font-size: 13.5px; padding: 6px 12px; }
.pour-cu { padding-left: 10px; border-left: 3px solid var(--line); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip .n { font-family: var(--font-mono); font-size: 12px; margin-left: 4px; opacity: .8; }

/* Formulaires */
.form { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .flabel { font-size: 13px; font-weight: 700; }
.field .sub { font-size: 12.5px; color: var(--muted); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; min-height: 40px; }
input[type=checkbox], input[type=radio] { width: auto; min-height: 0; accent-color: var(--accent); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--soft); }
textarea { resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { font-weight: 400; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; background: var(--bg); }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--soft); font-weight: 700; }
.errors { background: var(--late-soft); color: var(--late); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.errors ul { margin: 4px 0 0; padding-left: 18px; }
.check.ok { color: var(--paid); font-size: 13px; } .check.bad { color: var(--danger); font-size: 13px; }

/* Feuille */
#scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 12, .45); display: flex; align-items: flex-end; justify-content: center; }
#sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
@media (min-width: 700px) { #scrim { align-items: center; } #sheet { border-radius: 14px; max-height: 88vh; } }
.shead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 8px; position: sticky; top: 0; background: var(--surface); z-index: 1; border-bottom: 1px solid var(--line); }
.shead h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0; display: flex; flex-direction: column; }
.shead small { font-family: var(--font-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.xbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.sbody { padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 12px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); z-index: 40; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } } }

/* Factures */
.paper { width: 100%; aspect-ratio: 210 / 297; max-width: 100%; background: #FFFFFF; border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); overflow: hidden; }
.paper svg { display: block; width: 100%; height: 100%; }
.paper-wrap { position: relative; }
.badge-ex { position: absolute; top: 10px; right: 10px; background: var(--late-soft); color: var(--late); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.lines { display: flex; flex-direction: column; gap: 10px; }
.line { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, .9fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
@media (max-width: 560px) { .line { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .line .f-desc { grid-column: 1 / -1; } }
.line .lt { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 40px; height: 40px; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--danger); border-color: var(--danger); }
.total-row { display: flex; justify-content: space-between; align-items: baseline; }
.total-row .v { font-family: var(--font-mono); font-size: 24px; }

/* Listes cliquables (contacts, tâches, dépenses) */
.items { display: flex; flex-direction: column; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 8px; border-bottom: 1px solid var(--line); border-radius: 6px; cursor: pointer; text-decoration: none; color: inherit; }
.item:hover, .item.sel { background: var(--soft); }
.item .who { min-width: 0; display: flex; flex-direction: column; }
.item .who strong { overflow-wrap: anywhere; }
.item .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.item .amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tpill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.dl { display: grid; grid-template-columns: minmax(90px, max-content) minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.dl dt { color: var(--muted); font-size: 13px; }
.dl dd { margin: 0; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy { font-size: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 1px 8px; cursor: pointer; color: var(--muted); }
.notes { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 10px 12px; }

/* Tâches */
.task { display: flex; gap: 10px; align-items: flex-start; padding: 10px 6px; border-bottom: 1px solid var(--line); }
.task .tick { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--muted); background: none; cursor: pointer; flex: none; margin-top: 1px; display: grid; place-items: center; color: var(--accent-ink); }
.task.done .tick { background: var(--accent); border-color: var(--accent); }
.task.done .tick::after { content: "✓"; font-size: 14px; font-weight: 700; }
.task .body { flex: 1; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.task.done .body strong { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.task .meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.quick { display: flex; gap: 8px; }
.quick input { flex: 1; }

/* Heures */
.week { width: 100%; border-collapse: collapse; }
.week th { font-size: 12px; color: var(--muted); text-align: left; padding: 6px 4px; font-weight: 700; }
.week td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.week td.day { white-space: nowrap; font-size: 14px; width: 92px; }
.week td.day b { display: block; }

.hcell { display: flex; gap: 4px; align-items: center; }
.hcell input { width: 100%; max-width: 86px; text-align: right; font-family: var(--font-mono); padding: 6px 8px; }
.hcell .off { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 4px 7px; cursor: pointer; color: var(--muted); white-space: nowrap; }

.hweek th:first-child { width: 112px; }
@media (max-width: 620px) { .hweek th:first-child { width: 86px; } }
.hweek td { vertical-align: middle; }
.hbtn { width: 100%; min-height: 40px; border: 1px dashed transparent; border-radius: 8px; background: none; padding: 5px 8px; cursor: pointer; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center; color: var(--ink); }

.hbtn.full { background: var(--s-calendrier); border-style: solid; border-color: transparent; }
.hbtn b { font-family: var(--font-mono); font-weight: 500; font-size: 15px; }
.hbtn small { font-size: 12px; color: var(--muted); line-height: 1.25; }
.hbtn .plus { color: var(--muted); font-size: 13px; opacity: .7; }
.hbtn.mien .plus { color: var(--c-calendrier); opacity: 1; font-weight: 700; }
.tag-off { font-size: 12px; color: var(--blue); font-weight: 700; }
.tag-vac { font-size: 12px; color: var(--ev-vacances); font-weight: 700; }
.jrem { display: block; font-size: 12px; color: var(--muted); font-style: italic; margin-top: 2px; max-width: 140px; white-space: normal; }
@media (min-width: 621px) { .week tr.noteRow { display: none; } }
.bars { display: flex; flex-direction: column; gap: 8px; }

/* Cultures */
table.matrix { border-collapse: separate; border-spacing: 0; font-size: 13.5px; min-width: 100%; }
table.matrix th, table.matrix td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.matrix th:first-child, table.matrix td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.matrix thead th { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
table.matrix thead th button { font: inherit; border: 0; background: none; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
table.matrix tr.grp td { cursor: pointer; user-select: none; background: var(--mod-soft); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
table.matrix tr.grp td:first-child { background: var(--mod-soft); color: color-mix(in srgb, var(--mod) 75%, var(--ink)); }
table.matrix tr.grp td:first-child::before { content: "▾"; display: inline-block; width: 1.2em; transition: transform .15s; }
table.matrix tbody.closed tr.grp td:first-child::before { transform: rotate(-90deg); }
table.matrix tbody.closed tr:not(.grp) { display: none; }
table.matrix tr.grp td .cnt { font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; color: var(--muted); }
table.matrix td.tot { font-weight: 700; background: var(--soft); }
table.matrix td.neg { color: var(--muted); }


/* Calendrier */
.cal { display: flex; flex-direction: column; gap: 4px; }
.cal-h { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: capitalize; padding: 0 2px; }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cell { min-height: 104px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 6px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; font: inherit; color: inherit; overflow: hidden; }
.cell:hover { border-color: var(--mod); }
.cell.out { opacity: .45; }
.cell.we { background: #FBFBF7; }
.cell.vac { background: linear-gradient(0deg, color-mix(in srgb, var(--ev-vacances) 9%, white), color-mix(in srgb, var(--ev-vacances) 9%, white)); }
.cell.today { border: 2px solid var(--mod); }
.cell .top { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.cell .dn { font-weight: 700; font-size: 14px; }
.cell.today .dn { background: var(--mod); color: #fff; border-radius: 999px; padding: 0 6px; }
.cell .wk { font-size: 10.5px; color: var(--muted); }
.cell .hrs { margin-left: auto; display: flex; gap: 3px; }
.cell .h { font-family: var(--font-mono); font-size: 11px; background: var(--s-calendrier); color: #8A1A5D; border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.cell .chips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ch { display: block; font-size: 11.5px; line-height: 1.3; padding: 1px 5px; border-radius: 4px; background: color-mix(in srgb, var(--c) 14%, white); border-left: 3px solid var(--c); color: color-mix(in srgb, var(--c) 70%, black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch i { font-style: normal; font-family: var(--font-mono); font-size: 10.5px; }
.ch.fait { text-decoration: line-through; opacity: .65; }
.ch.multi { border-radius: 0; }
.ch.tache.urgent { font-weight: 700; }
.cell .more { font-size: 11px; color: var(--muted); }
.cell .dots { display: none; gap: 3px; flex-wrap: wrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
@media (max-width: 640px) {
  .cell { min-height: 58px; padding: 4px; }
  .cell .chips, .cell .wk { display: none; }
  .cell .dots { display: flex; }
  .cell .hrs { margin-left: 0; width: 100%; }
  .cell .h { font-size: 9.5px; padding: 0 2px; }
  .cal-h { font-size: 11px; }
}
.cstrip { display: flex; flex-direction: column; gap: 3px; background: var(--s-cultures); border-radius: 10px; padding: 10px; overflow-x: auto; }
.cs-head, .cs-row { display: grid; grid-template-columns: 110px minmax(calc(var(--n) * 20px), 1fr); gap: 8px; align-items: center; }
.cs-title { font-size: 11.5px; font-weight: 700; color: var(--c-cultures); text-transform: uppercase; letter-spacing: .06em; }
.cs-days, .cs-track { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.cs-days span { font-size: 10.5px; color: var(--muted); text-align: center; font-family: var(--font-mono); border-radius: 3px; }
.cs-days span.we { background: rgba(0,0,0,.05); }
.cs-days span.t { color: #fff; background: var(--c-taches); font-weight: 700; }
.cs-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-track { position: relative; height: 14px; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / var(--n) - 1px), rgba(0,0,0,.07) calc(100% / var(--n) - 1px) calc(100% / var(--n))); }
.cs-bar { grid-row: 1; height: 14px; border: 1px solid; border-radius: 7px; }
.cs-bar.harvest { border: 0; }
.cstrip .hint { font-size: 12px; }
.evline { border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 7%, white); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.seg label[style*="--c"] { border-left: 4px solid var(--c); }
.agday { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.agdate { border: 0; background: none; text-align: left; cursor: pointer; padding: 0; font: inherit; color: inherit; display: flex; flex-direction: column; }
.agdate b { text-transform: capitalize; }
.agdate span { color: var(--muted); font-size: 13px; }
.agitems { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.agit { border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 9%, white); border-radius: 6px; padding: 6px 10px; font-size: 14px; }
.agit.fait { text-decoration: line-through; opacity: .65; }
.agit.clic { cursor: pointer; }
.agit.clic:hover { background: color-mix(in srgb, var(--c) 18%, white); }
.daybtn { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; display: flex; flex-direction: column; }
.daybtn b { text-transform: capitalize; }
.daybtn span { color: var(--muted); font-size: 12.5px; }
.week .mini { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; max-width: 150px; }
/* Gantt des cultures (semaines) */
.gantt { display: flex; flex-direction: column; gap: 4px; overflow-x: auto; }
.g-row, .g-head { display: grid; grid-template-columns: 120px minmax(520px, 1fr); gap: 8px; align-items: center; }
.g-weeks { display: grid; grid-template-columns: repeat(53, minmax(0, 1fr)); position: relative; }
.g-head .g-weeks span { font-size: 10.5px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 2px; white-space: nowrap; overflow: visible; }
.g-name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.g-name .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.g-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-track { height: 20px; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 53 - 1px), var(--line) calc(100% / 53 - 1px) calc(100% / 53)); border-radius: 4px; }
.g-bar { grid-row: 1; height: 20px; border-radius: 6px; border: 1.5px solid; display: flex; align-items: center; font-size: 11px; padding: 0 5px; white-space: nowrap; overflow: hidden; }
.g-bar.harvest { border: 0; color: #fff; font-weight: 700; }
.g-today { grid-row: 1; width: 2px; background: var(--c-taches); justify-self: center; height: 24px; margin-top: -2px; }
.blocks { display: flex; flex-wrap: wrap; gap: 4px; }
.blk { width: 22px; height: 30px; border-radius: 4px; }
.pers { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 4px; margin: 0 0 12px; }
.pers legend { font-weight: 700; padding: 0 6px; }
.pers legend .meta { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
/* Plan de cultures modifiable */
table.matrix td input.cell-in { width: 92px; text-align: right; font-family: var(--font-mono); font-size: 13px; padding: 4px 6px; min-height: 30px; border-radius: 6px; background: #FFFFFF; border: 1px solid var(--line); }

/* Prospection */

.item.prow { justify-content: flex-start; }

.journal { display: flex; flex-direction: column; gap: 6px; }
.jl { border-left: 3px solid var(--c-contacts); padding: 4px 0 4px 10px; }

@media (min-width: 901px) { #ct-right { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 86px); overflow: auto; border-radius: 12px; } }
.lastj { background: var(--s-contacts); border-left: 4px solid var(--c-contacts); border-radius: 8px; padding: 10px 12px; }
.lastj p { margin: 6px 0 0; white-space: pre-wrap; }
.lastj.vide { background: var(--bg); border-left-color: var(--line); }
.pitchbox { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c-contacts); border-radius: 12px; }
.pitchbox summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--c-contacts); }
